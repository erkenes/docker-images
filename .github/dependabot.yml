
version: 2

registries:
  dhi-io:
    type: docker-registry
    url: https://dhi.io
    username: ${{ secrets.DOCKER_PASSWORD }}
    password: ${{ secrets.DOCKER_USERNAME }}

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/*/*"
      - "/*/*/*"
    registries:
      - dhi-io
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "php"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
